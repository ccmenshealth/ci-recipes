name: test
# Tests the canonical identifier guard and the repo-standard check, lints the scripts, and scans this repo with the guard.
# Cost: a few GitHub-hosted Linux runs a month, each billed as 1 minute ($0.006): under $0.10/month.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Lint (byte-compile, warnings are errors)
        run: >-
          python3 -W error -m py_compile identifier-guard/identifier-guard.py identifier-guard/tests/test_identifier_guard.py
          repo-standard/check.py repo-standard/tests/test_check.py lib/tests/test_apply.py org-move/tests/test_oidc.py
      - name: Unit tests (identifier guard)
        run: python3 -m unittest discover -s identifier-guard/tests -p 'test_*.py' -v
      - name: Unit tests (repo standard)
        run: python3 -m unittest discover -s repo-standard/tests -p 'test_*.py' -v
      - name: Unit tests (lib/apply.sh, tag pinning)
        run: python3 -m unittest discover -s lib/tests -p 'test_*.py' -v
      - name: Unit tests (org-move/move-repo.sh, OIDC twins)
        run: python3 -m unittest discover -s org-move/tests -p 'test_*.py' -v
      - name: Shell lint
        run: |
          shellcheck -x sync.sh new-repo.sh sweep.sh lib/apply.sh org-move/move-repo.sh
          sh -n identifier-guard/pre-commit
      - name: new-repo.sh dry run (private and public)
        run: |
          ./new-repo.sh ci-dry-run --private --dry-run
          ./new-repo.sh ci-dry-run --public --dry-run
      - name: Scan this repo with the canonical guard (whole files; regular files only, no symlinks or gitlinks)
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do [ -f "$f" ] && [ ! -L "$f" ] && printf '%s\0' "$f"; done \
            | xargs -0 python3 identifier-guard/identifier-guard.py --files
